name: CI

# Every push and every pull request. No step needs a secret: tests use the
# mock LLM and the mock provider, ANTHROPIC_API_KEY is forced empty.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (gofmt, vet, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Lint (gofmt)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Lint (go vet)
        run: go vet ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build ./...

  frontend:
    name: Frontend (install, type check, build, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      # No ESLint in the project; vue-tsc is the static check.
      - name: Lint (vue-tsc type check)
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test (vitest)
        run: npm test

  docker:
    name: make test + docker compose build
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ""
      LLM_MODE: mock
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Backend tests (with Postgres) and frontend tests, inside Docker,
      # exactly as on a developer machine. Mock LLM, no API key.
      - name: make test
        run: make test

      # Production images: api, worker, migrate, mock-provider, web.
      - name: docker compose build
        run: docker compose build

      - name: Clean up
        if: always()
        run: docker compose --profile test down -v --remove-orphans
