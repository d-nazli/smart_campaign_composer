root = "."
tmp_dir = "/tmp/air"

# build.cmd / build.bin are passed per service from docker-compose.dev.yml.
[build]
  cmd = "go build -o /tmp/main ./cmd/api"
  bin = "/tmp/main"
  include_ext = ["go"]
  exclude_dir = ["tmp", "testdata"]
  delay = 300
  stop_on_error = true
  kill_delay = "500ms"

[log]
  time = false

[misc]
  clean_on_exit = true
