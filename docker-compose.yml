name: smart-campaign

# Single bridge network: services reach each other by service name
# (postgres, api, mock-provider). Only web, api and mock-provider publish ports.
networks:
  app: {}

volumes:
  pgdata: {}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campaign}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campaign}
      POSTGRES_DB: ${POSTGRES_DB:-campaign}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [app]
    healthcheck:
      # -h 127.0.0.1 forces TCP. On a fresh volume the image first runs a
      # temporary server that listens on the unix socket only; a socket check
      # would report healthy too early and dependents would get "connection refused".
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # One-shot: migrations + seed. api/worker wait for it to finish successfully.
  migrate:
    build: { context: ./backend, target: tool }
    command: ["migrate", "seed"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-campaign}:${POSTGRES_PASSWORD:-campaign}@postgres:5432/${POSTGRES_DB:-campaign}?sslmode=disable
      SEED: ${SEED:-42}
      SEED_USERS: ${SEED_USERS:-5000}
    networks: [app]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  mock-provider:
    build: { context: ./backend, target: mockprovider }
    # Empty value = "use the built-in default" (see backend/internal/provider/config.go).
    # Defaults and how to lower the failure rates are documented in .env.example.
    environment:
      PROVIDER_LATENCY_MS: ${PROVIDER_LATENCY_MS:-}
      PROVIDER_LATENCY_JITTER_MS: ${PROVIDER_LATENCY_JITTER_MS:-}
      PROVIDER_ERROR_RATE: ${PROVIDER_ERROR_RATE:-}
      PROVIDER_429_RATE: ${PROVIDER_429_RATE:-}
      PROVIDER_RETRY_AFTER_MIN_SEC: ${PROVIDER_RETRY_AFTER_MIN_SEC:-}
      PROVIDER_RETRY_AFTER_MAX_SEC: ${PROVIDER_RETRY_AFTER_MAX_SEC:-}
      PROVIDER_RATE_LIMIT_PER_SEC: ${PROVIDER_RATE_LIMIT_PER_SEC:-}
      PROVIDER_TIMEOUT_RATE: ${PROVIDER_TIMEOUT_RATE:-}
      PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-}
      PROVIDER_FAIL_AFTER_ACCEPT_RATE: ${PROVIDER_FAIL_AFTER_ACCEPT_RATE:-}
      PROVIDER_SEED: ${PROVIDER_SEED:-}
    networks: [app]
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: { context: ./backend, target: api }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-campaign}:${POSTGRES_PASSWORD:-campaign}@postgres:5432/${POSTGRES_DB:-campaign}?sslmode=disable
      # auto: real Claude if ANTHROPIC_API_KEY is set, otherwise mock LLM.
      LLM_MODE: ${LLM_MODE:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
      # Pause between streamed fragments of the MOCK LLM (so the demo looks like streaming).
      MOCK_LLM_DELAY_MS: ${MOCK_LLM_DELAY_MS:-}
      # Fixed character allowance per personalization variable (empty = built-in default).
      VARIABLE_BUDGET_FIRST_NAME: ${VARIABLE_BUDGET_FIRST_NAME:-}
      VARIABLE_BUDGET_CITY: ${VARIABLE_BUDGET_CITY:-}
      # The dashboard's "worker" light: /api/system asks the worker's /healthz here.
      WORKER_HEALTH_URL: http://worker:9091/healthz
    networks: [app]
    ports:
      - "8081:8080"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  worker:
    build: { context: ./backend, target: worker }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-campaign}:${POSTGRES_PASSWORD:-campaign}@postgres:5432/${POSTGRES_DB:-campaign}?sslmode=disable
      PROVIDER_URL: http://mock-provider:8090
      # Empty value = built-in default (see backend/internal/worker/config.go).
      WORKER_RATE_PER_SEC: ${WORKER_RATE_PER_SEC:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-}
      WORKER_REQUEST_TIMEOUT_MS: ${WORKER_REQUEST_TIMEOUT_MS:-}
      # The SAME allowances the api validates templates with: the worker renders
      # with them and measures every message again before sending it.
      VARIABLE_BUDGET_FIRST_NAME: ${VARIABLE_BUDGET_FIRST_NAME:-}
      VARIABLE_BUDGET_CITY: ${VARIABLE_BUDGET_CITY:-}
    networks: [app]
    depends_on:
      migrate: { condition: service_completed_successfully }
      mock-provider: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9091/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: { context: ./frontend }
    networks: [app]
    ports:
      - "8080:80"
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---- test runners (profile "test"; used by `make test`, never by `up`) ----
  # They deliberately do NOT receive ANTHROPIC_API_KEY from .env: tests always
  # run against the mock LLM and need neither a key nor internet access.
  backend-test:
    profiles: [test]
    build: { context: ./backend, target: dev }
    command: ["go", "test", "./..."]
    environment:
      LLM_MODE: mock
      ANTHROPIC_API_KEY: ""
      # Integration tests create and drop their own throwaway databases here.
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-campaign}:${POSTGRES_PASSWORD:-campaign}@postgres:5432/postgres?sslmode=disable
    networks: [app]
    depends_on:
      postgres: { condition: service_healthy }


  # The same tests under the Go race detector (`make test-race`). Slower: the
  # binaries are instrumented and the first build compiles with cgo.
  backend-test-race:
    profiles: [test]
    build: { context: ./backend, target: race }
    command: ["go", "test", "-race", "./..."]
    environment:
      LLM_MODE: mock
      ANTHROPIC_API_KEY: ""
      CGO_ENABLED: "1"
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-campaign}:${POSTGRES_PASSWORD:-campaign}@postgres:5432/postgres?sslmode=disable
    networks: [app]
    depends_on:
      postgres: { condition: service_healthy }

  frontend-test:
    profiles: [test]
    build: { context: ./frontend, target: dev }
    command: ["npm", "test"]
    networks: [app]

  # ---- send-rate benchmark (`make bench`; never part of `make test`) ----
  backend-bench:
    profiles: [bench]
    build: { context: ./backend, target: dev }
    command: ["go", "test", "-tags=bench", "-run", "Bench", "-count=1", "-v", "-timeout=15m", "./internal/worker/"]
    environment:
      LLM_MODE: mock
      ANTHROPIC_API_KEY: ""
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-campaign}:${POSTGRES_PASSWORD:-campaign}@postgres:5432/postgres?sslmode=disable
    networks: [app]
    depends_on:
      postgres: { condition: service_healthy }

  # ---- opt-in smoke test against the real Claude API (`make test-live`) ----
  backend-test-live:
    profiles: [live]
    build: { context: ./backend, target: dev }
    command: ["go", "test", "-tags=live", "-run", "Live", "-v", "./..."]
    environment:
      LLM_MODE: claude
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-5-5}
    networks: [app]
